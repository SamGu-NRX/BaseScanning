[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hunter-local-ingest"
version = "0.1.0"
description = "Real-client evaluation harness for the local Hunter capture API: public adapter interface, conformance scenarios, labeled fault controls, sanitized receipts."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hunter-local-ingest = "hunter_local_ingest.runner:main"
hunter-selfcheck = "hunter_local_ingest.selfcheck:main"

[tool.setuptools.packages.find]
where = ["src"]

# Frozen expected traces ship as package data so a non-editable install's
# hunter-selfcheck can load them from inside the installed package. The
# glob (not a filename) lets future trace versions (e.g.
# expected-lifecycle-v2.jsonl) ship without a second packaging edit.
[tool.setuptools.package-data]
hunter_local_ingest = ["traces/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
