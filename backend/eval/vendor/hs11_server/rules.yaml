# Placement rules. Every length is in feet.
#
# Each number is {value, source}; `placeholder: true` marks a demo value with no public source.
# The solver hardcodes no distance: everything it compares against comes from here.
#
# At startup the server deep-merges a git-ignored private/rules.yaml over this file when one exists
# (path: $HOUSESCAN_PRIVATE_RULES, else <repo root>/private/rules.yaml). Mappings merge key by key;
# anything else in the private file replaces the public value. Never commit Base's values.

policy:
  id: demo
  version: "2026-09-26"
  # Decides automatically so the team can test real passes and rejects, although the driveway,
  # pool and reach values below are placeholders. HOUSESCAN_POLICY=strict sends every answer to a
  # person instead (rules.py STRICT_POLICY).
  auto_approve: true
  # Whether this policy may reject a site at all (some policies only pass or send to review).
  allow_reject: true
  notice: "Demo rules: public values and placeholders (pool 10 ft, drive 5 ft), not Base's."

battery:
  width_ft: {value: 2.583333333333, source: "Base Core spec: 30.68 in wide, rounded up to 31 in (docs/01 C2)"}
  depth_ft: {value: 1.833333333333, source: "Base Core spec: 22 in deep"}
  height_ft: {value: 3.291666666667, source: "Base Core spec: 39.5 in tall"}

# Default measurement error by how a position was measured, used when an item has no plus_minus_ft.
# These are the plan's estimates (docs/02 Lane C), not measured error bars; the D3 tape test checks them.
errors:
  tap_ft: {value: 0.3, source: "docs/02 Lane C estimate for AR taps; untested"}
  vlm_ft: {value: 1.5, source: "docs/02 Lane C estimate for photo detections; untested"}
  mesh_ft: {value: 0.5, source: "docs/02 Lane C estimate for the LiDAR mesh; untested"}
  tape_ft: {value: 0.05, source: "Tape measure read to the nearest half inch", placeholder: true}
  wall_ft: {value: 0.3, source: "Walls come from AR taps: docs/02 Lane C estimate; untested"}
  meter_ft: {value: 0.3, source: "The meter is an AR tap: docs/02 Lane C estimate; untested"}
  # Added per foot walked from the meter to the default error of AR-placed positions (tap and
  # vlm objects, walls, ground patches); not to tape, the meter itself or explicit plus_minus_ft.
  # 0.3 ft + 0.16 ft/ft covers S1's p90 at 3, 10 and 30 ft walked (0.78, 1.9, 5.1 ft).
  drift_per_ft: {value: 0.16, source: "S1 real-data evals (PR #12): ARKit drift on outdoor ADVIO walks, p90 8.2 in after 3 ft, 22.3 in after 10 ft, 60.1 in after 30 ft, mostly ~7% scale error. 2018 iPhone 6s, ARKit 1.0; current phones untested"}

sweep:
  step_ft: {value: 0.166666666667, source: "docs/01 C2: slide the footprint in 2 in steps"}
  # Wall ends closer than this are one corner, not a stretch with no wall. Two taps of one corner can
  # differ by twice the tap error.
  wall_join_ft: {value: 0.6, source: "Twice the AR tap error estimate", placeholder: true}
  # The meter must lie this close to its wall's line, or the scene is refused as malformed.
  meter_to_wall_max_ft: {value: 3.0, source: "Input sanity bound", placeholder: true}

clearances:
  gas_ft: {value: 3.0, source: "Base help page: 3 ft from the gas meter; Austin Energy §1.9; Texas Gas Service"}
  ac_ft: {value: 3.0, source: "Base help page: 3 ft from AC units, fences and other batteries"}
  opening_ft: {value: 3.0, source: "IRC 2021 R328.4: 3 ft from doors and windows directly entering the dwelling. Applying it to garage doors (openings.types) is a demo choice the code does not require"}
  drive_ft: {value: 5.0, source: "No public value (docs/01 rules table: TBD)", placeholder: true}
  pool_ft: {value: 10.0, source: "No public value (docs/01 rules table: TBD); the demo ring drawn in docs/eli5.html", placeholder: true}
  # Wall-mounted equipment directly above the battery: minimum sideways gap along the wall.
  wall_equipment_ft: {value: 0.0, source: "No public value; 0 means only overlap fails", placeholder: true}

openings:
  # A garage door counts: a battery must not stand in front of one.
  types: [door, garage_door, window]
  # When true, a window recorded as not operable does not count. Unknown operability always counts.
  exempt_fixed_windows: false
  # A window whose bottom edge is higher than this does not count (upper floors). null: all count.
  exempt_bottom_above_ft: null

wall_equipment:
  types: [elec_box, vent]

facing:
  min_ft: {value: 3.0, source: "Base help page: 3 ft from fences"}
  # battery_front: the gap is measured from the battery's front face (wall gap minus battery depth).
  # wall: the gap is measured from the wall, and min_ft already includes the battery's depth.
  measured_from: battery_front

headroom:
  min_ft: {value: 6.5, source: "NEC 110.26(A)(3) working-space headroom, applied to the battery as a demo choice", placeholder: true}

meter_working_space:
  width_ft: {value: 2.5, source: "NEC 110.26(A)(2): 30 in wide working space"}
  depth_ft: {value: 3.0, source: "NEC 110.26(A)(1): 36 in deep for 0-150 V to ground"}

ground:
  # Surfaces a battery may stand on. Anything else under the footprint fails; unknown ground is UNSURE.
  allowed: [concrete, gravel, lawn, mulch]
  # Surfaces vehicles reach, measured by clearances.drive_ft.
  drivable: [drive]
  source: "docs/01 ground types; which surfaces are allowed is a demo choice"
  placeholder: true

route:
  max_ft: {value: 20.0, source: "Base help page: within 20 ft of the meter"}
  # Past this length the route is UNSURE; beyond max_ft it fails.
  confident_reach_ft: {value: 15.0, source: "No public value", placeholder: true}
  height_ft: {value: 1.0, source: "Cable run height above ground", placeholder: true}
  corner_allowance_ft: {value: 0.5, source: "docs/02 Lane C: a little per corner", placeholder: true}
  # What a wall object across the route does: fail, review (UNSURE for a person), detour (go over or
  # under it at route height), allow (pass behind it). Types not listed are allowed.
  crossing:
    door: fail
    garage_door: fail
    window: detour
    elec_box: detour
    vent: detour
    gas_meter: detour
    ac: allow
    downspout: allow
    pool: allow
