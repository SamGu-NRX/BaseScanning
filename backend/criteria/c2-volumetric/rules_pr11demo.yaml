# C2 thresholds mirroring PR #11's public demo rules (t3/server/rules.yaml at cd0da8b), so the two
# engines can be compared under both rule sets. C2-only knobs (backing, ground steps, unknown bands)
# keep the rules_strictest.yaml placeholders.

battery:
  width_ft: 2.583333
  depth_ft: 1.833333
  height_ft: 3.291667

clearances:
  gas_ft: 3.0
  drive_ft: 5.0
  pool_ft: 10.0
  ac_ft: 3.0
  fence_ft: 3.0
  opening_ft: 3.0
  opening_types: [door, garage_door, window]
  wall_equipment_ft: 0.0
  wall_equipment_types: [elec_box, vent]

facing:
  measured_from: battery_front
  from_front_ft: 3.0
  min_width_ft: 2.5
  ignore_below_ft: 0.33
  top_ft: 6.5

headroom:
  min_ft: 6.5

meter_working_space:
  width_ft: 2.5
  depth_ft: 3.0

ground:
  allowed: [concrete, gravel, lawn, mulch]
  max_slope_deg: 5.0
  max_step_ft: 0.25
  min_observed_fraction: 0.8

wall_backing:
  max_gap_ft: 0.5
  min_backed_fraction: 0.85
  min_wall_height_ft: 7.5

route:
  max_ft: 20.0
  confident_reach_ft: 15.0
  same_wall: false
  corner_turn_deg: 30.0
  corner_penalty_ft: 0.5
  blocked_by: [door, garage_door]

unknown:
  wall_band_top_ft: 8.0
  ground_band_top_ft: 1.0
  tolerance_voxels: 0
