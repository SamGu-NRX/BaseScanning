# Machine-readable companion to docs/criteria-spec.md (v0.2, 2026-09-26).
# Source: the original internal/criteria/SSR_Prompts.md (authoritative, 13 prompts).
# v0.1 was derived from Hunter's Notion digest; v0.2 reconciles it against the original.
# Values marked approx are "about/roughly" in the source.
# Units: feet unless the key says _in. null = the profile does not state a rule.
# v0.1 subagentId: bc-93048192-3bbf-5d44-a35a-4f4828072eba; v0.2 reconciliation: bc-bb4dc500-3ca6-56de-9330-cbddd3cfa2d7

outcomes:
  decision: [pass, manual_review, reject]            # Battery Space (C), Main Panel Type, Main Panel Recall
  decision_no_reject: [pass, manual_review]          # placement A and B
  problem_flag: [no, manual_review, yes]             # P12; source: "yes means the problem is present (a reject)"
  problem_flag_not_same_wall: [no, manual_review]    # never yes
  label_extra: [undeterminable, not_applicable]      # ground-truth labels only

# Base photo-type ids that appear in the prompts.
photo_types: [electric_meter_close_up, electric_meter_surroundings, main_breaker_box_wall, main_breaker_box_open, main_disconnect_switch_photo]
placement_views: [behind_the_fence, around_the_corner, right, left, surroundings, close_up]   # a view can be absent; sequence does not matter

# Exact output schemas from the source. Key spelling is verbatim (note the hyphen in clean-decision).
output_schemas:
  multiple_mains:            # P1; the source gives fields, not a strict JSON literal
    hasTrueMultipleMainPanels: bool
    multipleMainPanelLabel: [unclear_or_insufficient_evidence, true_multiple_main_panels, single_main_plus_disconnect_or_subpanel]
    insufficientEvidence: bool
    also: [evidence, notes]
  oversized_can:             # P2
    hasLargeOrOversizedMeterCan: bool
    meterCanLabel: [large_or_oversized_meter_can, normal_meter_can, meter_can_unclear]
    insufficientEvidence: bool
    also: [evidence, notes]
  cl320:                     # P3
    hasCl320Meter: bool
    cl320Label: [cl320_meter, not_cl320_meter, cl320_unclear]
    insufficientEvidence: bool
    also: [evidence, notes]
  meter_number:              # P4
    keys: [reasoning, meter_number, clean-decision]
  meter_panel_relationship:  # P5, strict JSON. Listed values are a set; order is not significant.
    rationale: string
    confidence: float_0_1
    evidenceSufficiency: [insufficient, sufficient]
    relationshipSubtype: [unknown, non_garage_meter_wall, exterior_service_equipment, same_wall, 90_degree_garage_return_wall]
    meterPanelRelationship: [insufficient_evidence, not_applicable, co_located_exterior, not_back_to_back, back_to_back]
    meterGaragePosition: [unknown, not_visible, not_garage_wall, garage_exterior_wall_other, wall_immediately_adjacent_to_garage_opening]
    mainPanelLocation: [unknown, not_visible, non_garage_interior, exterior_service_equipment, garage_interior]
  placement_A:               # P6: the source gives no output block, only pass / manual_review
    decision: [pass, manual_review]
  placement_B:               # P7
    keys: [justification, decision]
    decision: [pass, manual_review]
    review_reason_strings: ["Insufficient wall space for hub", "Hub Conduit Routing"]
  placement_C:               # P8
    keys: [justification, reference_object, distance_ft, front_clearance_ft, drive_path_ft, requires_member_action, decision, needs_more_photos, missing_views]
    front_clearance_wide_open: 99
    drive_path_ft_null_if: [no_workable_spot, no_drive_visible]
    requires_member_action_on_reject: false
    missing_views_style: plain-language member-facing instructions, one ask per bullet
  main_panel_type:           # P9
    keys: [decision, justification]
  meter_mount:               # P10
    keys: [reasoning, type, clean-decision]
    type: [poleMountedMeter, meterBank, standardMeter, unknown]
  meter_type:                # P11
    keys: [meter_head_y_min, meter_head_y_max, meter_can_y_min, meter_can_y_max, distance_ratio, reasoning, type, clean-decision]
    type: [oversizedMeter, undersizedMeter, combinedMeter, standardMeter, unknown]
  meter_panel_location:      # P12, each field {verdict, reasoning}
    keys: [meterNotAccessible, panelNotAccessible, panelInHouse, notSameWall]
  panel_recall:              # P13
    keys: [justification, decision]

placement_profiles:
  A:
    source_prompt: "Battery Disconnect Placement"
    configuration: meter_disconnect_battery
    battery_in: {w: 24, d: 24, h: 36}
    walls: same_wall
    reach: {max_ft: 15, metric: unstated}            # "on the same wall, within 15 ft of the meter"
    gas_ft: 5                                        # meter, regulator, shutoff valve (pipes not listed, unlike C)
    drive_ft: 5
    drive_wrap_caution_ft: [1, 2]
    pool_ft: 5                                       # "a pool"; no kiddie-pool exemption stated
    facing_ft: null
    headroom_ft: null
    movable_ok: [trash_can, box]
    fixed_blocks: [hvac]
    opening_rule: {type: wall_clearance_from_windows_and_electrical_equipment, clearance_ft: null}
    route: {continuous_wall: required, windows: block, columns: block, electrical_equipment: block, door: unstated, garage: unstated}
    disconnect: {open_wall_beside_meter_ft: 2, box_size: about_meter_size, same_wall: true, below_meter_clear: true}
    can_reject: false
  B:
    source_prompt: "Battery Disconnect Placement — 3 ft Window Rule"
    utility_note: ComEd (Commonwealth Edison, Illinois); "stricter window rule"
    configuration: meter_disconnect_battery
    battery_in: {w: 24, d: 24, h: 36}
    walls: same_or_adjacent
    reach: {max_ft: 25, metric: wall_run}
    gas_ft: 5                                        # meter, regulator, shutoff valve
    drive_ft: 5
    drive_wrap_caution_ft: [1, 2]
    short_walkway_or_entry_steps: not_automatically_drivable
    pool_ft: 5                                       # permanent pool
    kiddie_pool_exempt: true
    facing_ft: null
    headroom_ft: {min_approx: 6, max_approx: 7, fail_causes: [raised_porch, raised_deck, low_eave, soffit, stairway, landing, crawl_space_opening]}
    ground_ok: [dirt, lawn, gravel, mulch, landscaping_bed, planter_bed, concrete_pad, mild_slope]
    ground_fail: [wooden_deck, patio_deck, raised_porch_platform, extreme_slope]
    thin_non_blocking: [downspout, downspout_extension, pvc_drain_vent_cleanout, conduit, hose_bib, small_utility_box, comms_box]
    fixed_blocks: [hvac_condenser, permanent_electrical_equipment]
    opening_rule:
      type: horizontal_clearance_each_side
      clearance_ft: 3
      applies_to: [door, window_well, operable_ground_level_window]
      exempt: [upper_floor_window, fixed_window]
      min_gap_between_openings_ft: 8                 # "~7 ft or less will not work"
      uncertain_well_or_window_type: manual_review
      also: not_under_or_blocking_opening_few_inches_clear
    spot_clear_of_electrical_equipment: true
    route: {windows: above_or_below_ok, low_voltage_lines_downspouts_pipes: over_ok, door: prohibited_over_and_below, garage: prohibited, fence_post: behind_or_drill, nearby_no_door_or_garage: assume_feasible}
    disconnect: {usable_wall_ft: [2, 2.5], above_meter_ok: true, conduit_bend_room_in: 6, below_meter_exit_clear: true, boxed_in_meter: manual_review}
    pedestal_meter: allowed_if_conduit_reaches_wall
    gap_estimation: {brick_course_in: 8, models_over_read_gaps: 2x}
    can_reject: false
  C:
    source_prompt: "Battery Space"
    configuration: meter_battery_harness             # the source's own reference photo ends at a disconnect box; "you don't need to worry about that"
    battery_in: {w: 31, d: 22, h: 36}
    usable_wall_ft: 3
    walls: same_or_adjacent
    wall_backing: {ok: [exterior_building_wall, shed_wall], fail: [yard_island, fence_only, past_corner_into_path, indoors], flush: true}
    reach: {pass_max_ft: 16, hard_max_ft: 26, metric: routed_cable, beyond_26_reject_only_if_unambiguous: true}
    gas_ft: 3                                        # from any part of the battery, incl. gas pipe run; ~6 ft contiguous wall
    drive_ft: 3                                      # in addition to the 2 ft depth; applies to the battery, not meter or harness
    drive_wrap_caution_ft: [1, 2]
    drive_indicators: [concrete, gravel, car_in_any_photo, garage_apron]
    car_proves_drivable: true                        # even dirt, grass or gravel
    short_walkway_or_entry_steps: not_automatically_drivable
    pool_ft: 10
    pool_pass_only_if: clearly_separate_area
    pool_tells: [pump, filter, heater, pvc_cluster, floaties, noodles, beach_towels]
    kiddie_pool_exempt: true
    facing_ft: 5                                     # measured as empty space; already accounts for battery + working room
    facing_near_5: manual_review
    headroom_ft: {min_approx: 6, max_approx: 7, fail_causes: [low_eave, soffit, stairway, landing, raised_porch, raised_deck, overhang]}
    ground_ok: [dirt, lawn, gravel, mulch, planter_bed, concrete_pad, mild_slope]
    ground_fail: [wooden_deck, patio_deck, raised_platform, extreme_slope, steep_concrete]
    opening_rule:
      type: do_not_sit_under_or_block
      clearance_ft: null                             # "a few inches clear"
      applies_to: [door, window_well, operable_ground_level_window, shed_door, gate]
      swing: {toward_spot: clear_full_arc, away: not_in_doorway}
      exempt: [upper_floor_window, fixed_window]
      unresolved_well_swing_entrance: manual_review
    walkways: {main_entrance_path: must_stay_clear, only_spot_on_secondary: manual_review}
    service_access: {beside_equipment: ok_if_one_side_accessible, cover_equipment_front: fail, directly_under_wall_electrical_or_comms_box: fail, directly_under_vent: fail}
    street_facing_front_only: manual_review
    route:
      cable_in: 1
      support_every_ft: 3
      windows: above_or_below_ok
      ac_and_wall_equipment: behind_ok
      low_voltage_lines_downspouts_pipes: over_ok
      door: {above: manual_review, below_or_across: prohibited}
      garage: prohibited
      driveway_crossing: prohibited
      loose_ground_run: prohibited
      gap_without_wall: prohibited                   # e.g. sliver of wall above a doorway
      fence_post: {behind_gap_in: 2, drill_post_in: 4.5}
      whole_route_must_be_visible: true
    meter_access: {cramped_or_under_porch_deck_stairs_crawlspace: manual_review, clearly_inaccessible_no_other_access: reject}
    photo_calibration: {confident_reject_within_ft: 1, uncertain_band_ft: [2, 6], clearly_larger: pass}   # gas and drive
    gap_estimation: {brick_course_in: 8, models_over_read_gaps: 2x, models_under_estimate_large_distances: true}
    pass_requires_visible: [spot_width_3ft, front_depth_5ft, ground, full_harness_route]
    can_reject: true
    reject_requires: [both_wall_ends_seen, every_reachable_candidate_clearly_fails, no_plausible_unseen_space]
    needs_more_photos: {true_if: [deciding_space_unseen, relied_on_spot_obscured], false_if: [clean_spot_found, seen_and_bad]}

movable_B: [bin, box, potted_plant, bush, planter_bed, hose, hose_reel, grill, patio_furniture, play_equipment, kiddie_pool]
movable_C: [plant, bush, garden, planter_bed, mulch, bin, box, trash_can, hose, hose_reel, grill, patio_furniture, play_equipment, kiddie_pool, comms_box, cable_box, single_gate, short_fence_section, downspout, pvc_pipe, hose_bib, small_utility_box]
fixed_C: [hvac_condenser, permanent_electrical_equipment, gas_meter, operable_ground_level_window, window_well, permanent_pool, parallel_fence_run]

# Proposal, not Base policy: pass under S implies pass under A, B and C.
strict_composite_S:
  battery_in: {w: 31, d: 24, h: 39.5}
  walls: same_wall
  reach: {max_ft: 15, metric: routed_cable}
  gas_ft: 5
  drive_ft: 5
  pool_ft: 10
  facing_ft: 5
  headroom_ft: 7
  opening_rule: {type: horizontal_clearance_each_side, clearance_ft: 3}
  route: {windows: block, door: block, garage: block, driveway_crossing: block}
  disconnect: {open_wall_beside_meter_ft: 2.5, conduit_bend_room_in: 6}
  reject: same_as_C

meter_prompts:
  meter_number:
    modality: R
    prefer: [close_up_photo, utility_label_over_manufacturer_serial]
    strip_barcode_wrappers: {example: {DARG272815824: "272815824"}}
    exclude: [kwh, class, form, voltage, amperage, phase, model, fcc_id, ul_id, service_labels, address, account, esi_id, breaker_rating, panel_label, handwritten]
    clean_false_if: [multiple_meters, duplex, meter_bank, partial_meter, glare, scratch, sticker, dirt, obstruction, too_far_small, no_electric_meter, gas_meter_only]
    empty_string_if: no_electric_meter_number_photographed
  cl320: {modality: R, true_if: readable_meter_face_or_label_says_CL320, not_evidence: [CL200, class_200, can_size, service_equipment, breaker_amperage, panel_label], unreadable: cl320_unclear, insufficient_if: no_readable_meter_face_or_label}
  oversized_can:
    modality: P
    judge: enclosure_directly_holding_round_meter
    cl200_not_counter_evidence: true
    ignore: [service_disconnect, breaker_panel, load_center, solar, transfer_switch, emergency_disconnect, conduit, breaker_amperage]
    unknown: meter_can_unclear
  meter_type:
    modality: P
    ratio: (can_y_max - can_y_min) / (head_y_max - head_y_min)   # single photo, 0-1000 normalised y, head = glass/dome only
    min_head_units: 10
    ratio_invalid_if: [can_y_min_is_0, can_y_max_is_1000]
    close_up_needs_wall_strip_above_and_below: true
    classes: {standard: 2, oversized: [3, 4], undersized: [1, 1.5], combined: meter_and_main_in_one_unit}
    borderline: unclean                              # standard/oversized (~3) and standard/undersized
    prose_conflict: "prose says heads counted 'not including meter-head itself'; the formula includes it (spec conflict #29)"
  meter_mount: {modality: P, classes: [standardMeter, poleMountedMeter, meterBank, unknown], bank_signal_min_meters: 3, two_meters: unclean, propped_up: unclean}

panel_prompts:
  multiple_mains: {modality: P+R, not_mains: [closed_or_distant_adjacent_box, service_disconnect, transfer_switch, emergency_disconnect, meter_main, solar_equipment, sub_panel, lone_two_pole_breaker], one_feeds_other: single_main_plus_disconnect_or_subpanel, unknown_relationship: unclear_or_insufficient_evidence}
  main_panel_type: {confirmed_multiple_each_main_visible: reject, single: pass, review_if: [two_similar_no_observable_main, mains_in_different_locations, unsure_sub_vs_main, insufficient_photos], separate_disconnect_enclosure: usually_single_main}
  meter_panel_relationship: {modality: G+P, see: output_schemas.meter_panel_relationship}
  location_access:
    envelope_ft: {depth: 3, width: 2.5, overhead_review_below: 6, gas_review_within: 3}
    ignore: [trivially_movable, building_structure, built_in_enclosure, junction_box, conduit]
    review: [substantial_stored_goods, racks, shelving, fixed_shelf, low_overhead, gas_within_3ft, frontage_unseen]
    yes_reject: [overgrown_vegetation, bush, ac_condenser, water_heater, walled_in, boxed_off]
    garage_cues: [bare_studs, garage_door, concrete_floor, water_heater, hvac, parked_car]
    not_same_wall_never_yes: true
  panel_recall:
    reject_brands: [Federal Pacific, Federal Pacific Electric, FPE, Stab-Lok, Challenger, Zinsco, GTE-Sylvania, Zinsco-Sylvania, Magnetrip, Sylvania]
    review_brands: [Westinghouse]
    reject_if: [confident_recalled_brand_text, heavy_widespread_corrosion, vertical_breaker_up_off]
    review_if: [light_or_uncertain_rust, old_or_dated, round_pushbutton_breakers, exposed_or_loose_wiring, missing_deadfront, unreadable_missing_ambiguous_brand, unreadable_on_off, old_or_rusted_disconnect_secondary, insufficient_photos]
    pass_phrase_conflict: "pass text allows 'no visible recalled brand'; review list says missing brand -> review (spec conflict #13)"
