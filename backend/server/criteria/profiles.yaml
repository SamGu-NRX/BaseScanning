# Rule profiles for the criteria engine. Lengths in feet.
# Reconciled to the WS-09 brief §4.2. Battery height is 39.5 in in every profile.
# ac_ft is 0: the engine requires the key; AC blocks through footprint_clear and route crossing allow.
# facing.min_ft / headroom.min_ft null means that profile does not apply the check.

base:
  policy: {auto_approve: true, allow_reject: true}
  battery: {width_ft: 2.583333, depth_ft: 1.833333, height_ft: 3.291667}
  backing_min_ft: 0.0
  clearance_measure: plan
  clearances: {gas_ft: 3.0, ac_ft: 0.0, drive_ft: 5.0, pool_ft: 10.0, wall_equipment_ft: 0.0}
  wall_equipment_types: [elec_box, vent]
  openings:
    types: [door, garage_door, window]
    min_ft: 3.0
    measure: plan
    ground_level_max_bottom_ft: null
    exempt_fixed_windows: false
    under_window_any_height: false
  facing: {min_ft: null, measured_from: wall}
  headroom: {min_ft: null, zone_out_ft: 3.0}
  meter_working_space: {width_ft: 2.5, depth_ft: 3.0}
  ground:
    allowed: [concrete, gravel, lawn, mulch]
    drivable: [drive]
    max_slope: 0.10
    max_step_ft: 0.25
  route:
    max_ft: 20.0
    confident_reach_ft: 15.0
    corner_allowance_ft: 0.5
    height_ft: 1.0
    max_corners: 99
    crossing:
      door: fail
      garage_door: fail
      window: detour
      elec_box: detour
      vent: detour
      gas_meter: detour
      ac: allow
      downspout: allow
      pool: allow

contract: {fail_needs_observed: true}

profiles:
  public:
    id: public
    source: "PR #11 server/rules.yaml (cd0da8b); comparison only, never the device default"
    battery: {width_ft: 2.583333, depth_ft: 1.833333, height_ft: 3.291667}
    clearances: {gas_ft: 3.0, ac_ft: 3.0, drive_ft: 5.0, pool_ft: 10.0}
    facing: {min_ft: 3.0, measured_from: battery_front}
    headroom: {min_ft: 6.5, pass_above_ft: 6.5}
    route: {max_ft: 20.0, confident_reach_ft: 15.0, max_corners: 99}
  A:
    id: A
    source: "Base profile A, Battery Disconnect"
    policy: {allow_reject: false}
    battery: {width_ft: 2.0, depth_ft: 2.0, height_ft: 3.291667}
    backing_min_ft: 0.0
    clearances: {gas_ft: 5.0, drive_ft: 5.0, pool_ft: 5.0}
    openings: {min_ft: 3.0, under_window_any_height: true, ground_level_max_bottom_ft: null}
    facing: {min_ft: null}
    headroom: {min_ft: null}
    route:
      max_ft: 15.0
      confident_reach_ft: 15.0
      max_corners: 0
      crossing: {window: fail, door: fail, garage_door: fail}
  B:
    id: B
    source: "Base profile B, 3 ft Window Rule (ComEd)"
    policy: {allow_reject: false}
    battery: {width_ft: 2.0, depth_ft: 2.0, height_ft: 3.291667}
    backing_min_ft: 0.0
    clearances: {gas_ft: 5.0, drive_ft: 5.0, pool_ft: 5.0}
    openings: {min_ft: 3.0, under_window_any_height: false, ground_level_max_bottom_ft: 6.0}
    facing: {min_ft: null}
    headroom: {min_ft: 6.0, pass_above_ft: 7.0}
    ground: {allowed: [concrete, gravel, lawn, mulch, dirt]}
    route:
      max_ft: 25.0
      confident_reach_ft: 25.0
      max_corners: 1
      crossing: {window: detour, door: fail, garage_door: fail}
  C:
    id: C
    source: "Base profile C, Battery Space"
    policy: {allow_reject: true}
    battery: {width_ft: 2.583333, depth_ft: 1.833333, height_ft: 3.291667}
    backing_min_ft: 3.0
    clearances: {gas_ft: 3.0, drive_ft: 3.0, pool_ft: 10.0}
    openings: {min_ft: 0.0, under_window_any_height: false, ground_level_max_bottom_ft: 6.0}
    facing: {min_ft: 5.0, measured_from: wall}
    headroom: {min_ft: 6.0, pass_above_ft: 7.0}
    ground: {allowed: [concrete, gravel, lawn, mulch, dirt]}
    route:
      max_ft: 26.0
      confident_reach_ft: 16.0
      max_corners: 1
      crossing: {window: detour, door: door_over_review, garage_door: fail}
  S:
    id: S
    source: "per-parameter strictest; allow_reject matches profile C (spec 7.4)"
    policy: {allow_reject: true}
    battery: {width_ft: 2.583333, depth_ft: 2.0, height_ft: 3.291667}
    backing_min_ft: 3.0
    clearances: {gas_ft: 5.0, drive_ft: 5.0, pool_ft: 10.0}
    openings: {min_ft: 3.0, under_window_any_height: true, ground_level_max_bottom_ft: null}
    facing: {min_ft: 5.0, measured_from: wall}
    headroom: {min_ft: 7.0, pass_above_ft: 7.0}
    ground: {allowed: [concrete, gravel, lawn, mulch, dirt]}
    route:
      max_ft: 15.0
      confident_reach_ft: 15.0
      max_corners: 0
      crossing: {window: fail, door: fail, garage_door: fail}
