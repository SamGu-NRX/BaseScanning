[project]
name = "house-scanning-server"
version = "0.0.0"
description = "Server-side processing for Base Power battery site surveys: capture packet in, metric 3D asset, scene, criteria verdicts and needed views out."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "jsonschema==4.26.0",
    "matplotlib==3.11.2",
    "modal>=1.5.5",
    "numba>=0.63",
    "numpy==2.5.3",
    "opencv-python-headless==5.0.0.93",
    "pillow==12.3.0",
    "pillow-heif>=1.0",
    "py7zr>=1.1.3",
    "pycolmap==4.2.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-image>=0.26",
    "scipy==1.18.1",
    "shapely>=2.1.2",
    "jinja2>=3.1.4",
    "httpx>=0.27",
    "PyJWT[crypto]",
    "boto3",
    "google-auth>=2.30",
    "google-cloud-storage>=2.18",
    "google-resumable-media",
    "python-ulid",
]

[project.optional-dependencies]
packet = [
    "pillow-heif>=1.0",
    "pillow",
    "numpy",
    "jsonschema",
]
result = [
    "numpy==2.5.3",
    "jsonschema==4.26.0",
    "jinja2>=3.1.4",
    "pillow==12.3.0",
    "httpx>=0.27",
]
# Brief §1: `uv sync --frozen --extra reads`. pillow, numpy, pydantic, and jsonschema
# are also direct dependencies; they are repeated so the extra matches the brief list.
reads = [
    "openai>=1.40",
    "pillow==12.3.0",
    "zxing-cpp==3.1.1",
    "numpy==2.5.3",
    "pydantic>=2.13.5",
    "jsonschema==4.26.0",
]
criteria = [
    "numpy==2.5.3",
    "scipy==1.18.1",
    "shapely>=2.1.2",
    "pyyaml>=6.0.3",
    "jsonschema==4.26.0",
    "pillow==12.3.0",
    "numba>=0.63",
    "scikit-image>=0.26",
    "openai>=1.100",
]
objects = [
    "torch>=2.6",
    "transformers>=4.48",
    "open_clip_torch>=2.32",
    "openai>=1.60",
]
scale = [
    "opencv-python-headless==5.0.0.93",
    "scipy==1.18.1",
]
# Open3D TSDF. Also listed in the dev group because the CI test job syncs that
# group and never passes --extra. A non-dev sync can still ask for this extra.
dense = [
    "open3d==0.20.0",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]",
    "httpx",
    "google-cloud-storage>=2.18",
    "google-auth>=2.30",
    "google-resumable-media",
    "boto3",
    "PyJWT[crypto]",
    "python-ulid",
    "pydantic-settings>=2.6",
    "import-linter>=2.1",
]
ios-kit = [
    "httpx>=0.28.1",
    "uvicorn>=0.35.0",
]
gpu = [
    "einops==0.8.0",
    "huggingface-hub==0.26.2",
    "plyfile==1.1",
    "safetensors==0.4.5",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "tqdm==4.66.5",
]

[tool.uv]
package = false
default-groups = ["dev", "data"]
override-dependencies = ["torch==2.5.1", "torchvision==0.20.1"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --import-mode=importlib"
testpaths = ["packet/tests", "tests", "server"]
pythonpath = [".", "packet", "eval", "eval/vendor/hs11_server", "ios-kit"]
markers = [
    "live: OpenAI and xAI calls; skipped unless OPENAI_API_KEY and XAI_API_KEY are set",
    "live: needs real GCS or R2 credentials",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["eval/vendor", "server/eval/vendor", "private", "server/criteria/c1/engine3d.py", "server/criteria/c2/grid.py", "server/criteria/c2/sweep.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

# packet/, eval/, criteria/spec/ and data/scripts/ are overwritten by scripts/sync_from_store.sh,
# and the breadth folders by scripts/sync_breadth.sh, so style fixes there belong in the store copy.
# docs/ is the planning copy of the store briefs; ruff formats Python inside markdown fences.
# Tighten these once upstream is clean.
[tool.ruff.lint.per-file-ignores]
"{packet,eval,criteria/spec,data}/**" = ["B", "UP", "I001", "F401", "F841"]
"server/eval/**" = ["B", "UP", "I001", "F401", "F841", "E402"]
"server/{common/geometry,poses/colmap_prior,dense/dense,dense/models,scale/lidar,coverage/occlusion,packet/validate_legacy,orchestrator/legacy_run_packet}.py" = ["B", "UP", "I001", "F401", "F841"]
"{recon,scene,criteria}/[abc][1-9]-*/**" = ["B", "UP", "I001", "F401", "F841", "F403", "F405", "E4", "E7", "W"]
"{recon,scene,criteria}/a1[0-9]-*/**" = ["B", "UP", "I001", "F401", "F841", "F403", "F405", "E4", "E7", "W"]
"{recon,scene,criteria}/e2e-*/**" = ["B", "UP", "I001", "F401", "F841", "F403", "F405", "E4", "E7", "W"]
"server/criteria/c1/engine3d.py" = ["B", "UP", "I001", "F401", "F841", "F403", "F405", "E4", "E7", "W"]
"server/criteria/c2/{grid,sweep}.py" = ["B", "UP", "I001", "F401", "F841", "F403", "F405", "E4", "E7", "W"]

[tool.coverage.run]
omit = ["server/packet/cli.py", "server/packet/tests/*"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false

# WS-00 owns server/contracts. mypy server/packet follows that import and
# reports a pydantic stub mismatch in _base.py that this package cannot edit.
[[tool.mypy.overrides]]
module = ["server.contracts", "server.contracts.*"]
follow_imports = "silent"

[tool.ruff.format]
exclude = ["packet/**", "eval/**", "server/eval/**", "criteria/spec/**", "data/**", "recon/**", "scene/**", "criteria/c[1-3]-*/**", "criteria/e2e-*/**", "docs/**", "server/common/geometry.py", "server/poses/colmap_prior.py", "server/dense/dense.py", "server/dense/models.py", "server/scale/lidar.py", "server/coverage/occlusion.py", "server/packet/validate_legacy.py", "server/orchestrator/legacy_run_packet.py", "server/criteria/c1/engine3d.py", "server/criteria/c2/grid.py", "server/criteria/c2/sweep.py", "ios-kit/packetgen/**"]

[dependency-groups]
data = [
    "remotezip==0.12.6",
]
dev = [
    "import-linter>=2.15",
    "pytest==9.1.1",
    "pytest-cov>=6.0",
    "ruff>=0.16.9",
    "mypy>=1.13",
    # The CI test job syncs this group and does not pass --extra. Open3D stays
    # out of the base install; this is what makes the TSDF tests run there.
    "open3d==0.20.0",
]

[tool.importlinter]
root_packages = ["server"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Contracts import only themselves"
type = "forbidden"
source_modules = ["server.contracts"]
forbidden_modules = [
    "server.common",
    "server.eval",
    "server.api",
    "server.orchestrator",
    "server.packet",
    "server.poses",
    "server.objects",
    "server.reads",
    "server.scale",
    "server.dense",
    "server.coverage",
    "server.scene",
    "server.criteria",
    "server.result",
]
ignore_imports = ["server.contracts.cli -> server.eval.sceneio"]

[[tool.importlinter.contracts]]
name = "Common imports only contracts"
type = "forbidden"
source_modules = ["server.common"]
forbidden_modules = [
    "server.eval",
    "server.api",
    "server.orchestrator",
    "server.packet",
    "server.poses",
    "server.objects",
    "server.reads",
    "server.scale",
    "server.dense",
    "server.coverage",
    "server.scene",
    "server.criteria",
    "server.result",
]

[[tool.importlinter.contracts]]
name = "Eval imports only contracts and common"
type = "forbidden"
source_modules = ["server.eval"]
forbidden_modules = [
    "server.api",
    "server.orchestrator",
    "server.packet",
    "server.poses",
    "server.objects",
    "server.reads",
    "server.scale",
    "server.dense",
    "server.coverage",
    "server.scene",
    "server.criteria",
    "server.result",
]
# SD-84: these two edges are the only way server.eval reaches the stage entry points.
ignore_imports = [
    "server.eval.pipeline_adapters -> server.criteria",
    "server.eval.pipeline_adapters -> server.poses",
]

[[tool.importlinter.contracts]]
name = "Stages do not import each other"
type = "independence"
modules = [
    "server.packet",
    "server.poses",
    "server.scale",
    "server.dense",
    "server.coverage",
    "server.scene",
    "server.objects",
    "server.reads",
    "server.criteria",
    "server.result",
]
# Coverage writes the scene draft through the builder. The brief's CLI is
# `python -m server.scene.pipeline`, which calls dense and coverage.
# Main's old ignore `server.dense.models -> server.coverage.occlusion` has no
# match in this tree, so import-linter rejects it. The four edges below are the
# ones this branch still imports.
ignore_imports = [
    "server.coverage.run -> server.scene.build",
    "server.scene.pipeline -> server.coverage.run",
    "server.scene.pipeline -> server.dense.params",
    "server.scene.pipeline -> server.dense.run",
]

[[tool.importlinter.contracts]]
name = "API does not import stages or eval directly"
type = "forbidden"
source_modules = ["server.api"]
forbidden_modules = [
    "server.eval",
    "server.packet",
    "server.poses",
    "server.objects",
    "server.reads",
    "server.scale",
    "server.dense",
    "server.coverage",
    "server.scene",
    "server.criteria",
    "server.result",
]
allow_indirect_imports = true
