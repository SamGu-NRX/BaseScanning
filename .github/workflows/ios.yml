name: iOS

on:
  push:
    branches: [main, t3/ios-mvf]
    paths:
      - "ios/**"
      - "!ios/**/*.md"
      - ".github/workflows/ios.yml"
  pull_request:
    # ready_for_review: drafts are skipped below, so run once a draft is marked ready.
    # labeled: adding full-ui reruns the pull request with the accessibility audit.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - "ios/**"
      - "!ios/**/*.md"
      - ".github/workflows/ios.yml"
  # Runs every test, the audit included, on any branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Adding any label other than full-ui gets a group of its own, so it cannot cancel a real run.
  group: ios-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'full-ui' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios-build:
    # Two groups of the UI tests, one job each (ios/Tools/ui-test-groups.py holds their selectors
    # and checks that together they run every test once). One job risks exceeding the cap below:
    # #214's hosted UI step took 72.3 min, and photo processing's tests add about 7.7 min measured
    # locally (BRIEF-19), before setup and the build. No combined run has been seen to fail. journey runs the package tests and the Debug
    # device build; photoProcessing runs the unsigned Release build. fail-fast is off so a failure
    # in one group still leaves the other's results.
    name: iOS build (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        group: [journey, photoProcessing]
    # A free account runs 5 macOS jobs at once, shared by every open pull request, so drafts and
    # labels other than full-ui don't take a slot.
    if: >-
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
       (github.event.action != 'labeled' || github.event.label.name == 'full-ui'))
    # macos-26 (arm64) is the newest GA macOS image. The xcode-27 image is still a preview.
    runs-on: macos-26
    # Beta run 36302099002 took 43 minutes before the spot-confirmation and review checks
    # were added. Full run 36832282114 (#190) then took 58 of 60 minutes, and the ground
    # freshness UI tests add about 161 s more (run 36744881974), so 60 would cut the
    # every-state audit short. 75 left room until the 2026-10-03 candidate's 86 UI cases:
    # run 37121918073 attempt 2 spent 10 min 34 s before the UI step and 64 min 39 s in it,
    # and the cap stopped it after 76 cases with 0 failures. 90 ran all of them; since photo
    # processing's tests moved to their own job, 90 is the cap for each group.
    timeout-minutes: 90
    env:
      # Newest stable Xcode on macos-26 per images/macos/macos-26-arm64-Readme.md (image 20260907).
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # iPhone 17 on iOS 26.5 ships with Xcode 26.6 on macos-26 (images/macos/macos-26-arm64-Readme.md).
      SIM_NAME: iPhone 17
      SIM_OS: "26.5"
      # Homebrew only installs the latest XcodeGen. The release zip gives an exact version,
      # and the drift check below needs the same version the committed project was made with.
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
      # The every-state accessibility audit relaunches the app 65 times (about 10 min). Pull
      # requests skip it unless labelled full-ui; pushes and manual runs always include it. It is
      # in the journey group; photoProcessing always runs its own audits.
      GROUP: ${{ matrix.group }}
      FULL_UI: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ui') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::$DEVELOPER_DIR is not on this runner image. Pick an installed Xcode from the image readme."
            exit 1
          fi
          xcodebuild -version
          swift --version

      # Before anything slow: the two groups' selectors must cover every UI test exactly once.
      - name: Check the UI test groups
        run: python3 ios/Tools/ui-test-groups.py check

      # Booting takes 2 to 3 minutes and needs nothing from the build, so it runs alongside the
      # steps below; the UI test step waits for it.
      - name: Boot the Simulator in the background
        run: |
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-${SIM_OS//./-}"
          udid="$(xcrun simctl list devices available -j \
            | jq -r --arg runtime "$runtime" --arg name "$SIM_NAME" \
              '(.devices[$runtime] // [])[] | select(.name == $name) | .udid' | head -n 1)"
          if [ -z "$udid" ]; then
            echo "::error::No $SIM_NAME on iOS $SIM_OS on this runner image. Pick one from the image readme."
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          nohup xcrun simctl bootstatus "$udid" -b > "$RUNNER_TEMP/simulator-boot.log" 2>&1 &

      # The package's drift test compares the vendored server schemas with the server's own copies:
      # the checkout's files once that branch merges, else the t3/server branch, which the shallow
      # checkout leaves out. One of the two is required:
      # a failed fetch fails the run, and HOUSESCAN_REQUIRE_UPSTREAM makes the tests fail rather
      # than skip, so CI can't go green without comparing. The checkout counts only when it holds
      # every compared file: a folder alone isn't enough (main has a server/ without schemas).
      - name: Fetch the server contract
        if: matrix.group == 'journey'
        run: |
          fetch_unless_present() {
            local branch="$1"; shift
            local missing=0
            for file in "$@"; do [ -f "$file" ] || missing=1; done
            if [ "$missing" = 0 ]; then
              echo "$* are in the checkout; the drift tests read them."
              return
            fi
            if ! git fetch --no-tags --depth=1 origin "+refs/heads/$branch:refs/remotes/origin/$branch"; then
              echo "::error::Neither the checkout nor $branch holds $*, so the vendored copies can't be compared."
              exit 1
            fi
          }
          fetch_unless_present t3/server server/schemas/scene.schema.json server/schemas/result.schema.json server/tests/fixtures/example-scene.json

      - name: Install XcodeGen
        if: matrix.group == 'journey'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate project
        if: matrix.group == 'journey'
        run: xcodegen generate --spec ios/project.yml

      - name: Check committed project matches project.yml
        if: matrix.group == 'journey'
        run: |
          if ! git diff --exit-code -- ios; then
            echo "::error::HouseScan.xcodeproj differs from project.yml. Run 'make ios-project' (XcodeGen ${XCODEGEN_VERSION}) and commit the result."
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard -- ios)"
          if [ -n "$untracked" ]; then
            echo "::error::xcodegen generate wrote files that are not committed. Run 'make ios-project' and commit them."
            echo "$untracked"
            exit 1
          fi

      - name: Test HouseScanKit
        # The capture logic is a plain Swift package; its tests run on macOS without a Simulator.
        # Once per run: photoProcessing builds the same package sources into its Release build.
        if: matrix.group == 'journey'
        env:
          HOUSESCAN_REQUIRE_UPSTREAM: "1"
        run: swift test --package-path ios/HouseScanKit -Xswiftc -warnings-as-errors

      # CI builds once from clean, so the index Xcode keeps for editing is wasted work.
      - name: Build
        if: matrix.group == 'journey'
        run: >-
          xcodebuild -project ios/HouseScan.xcodeproj -scheme HouseScan -configuration Debug
          -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build

      # Proves the Release configuration compiles, the photo-processing setup gate included, whose
      # fixture switches exist only in Debug. It doesn't show what Release does at run time.
      - name: Build Release, unsigned
        if: matrix.group == 'photoProcessing'
        run: >-
          xcodebuild -project ios/HouseScan.xcodeproj -scheme HouseScan -configuration Release
          -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build

      - name: Wait for the Simulator
        timeout-minutes: 10
        run: |
          xcrun simctl bootstatus "$SIM_UDID" -b
          echo "Booted $SIM_NAME on iOS $SIM_OS ($SIM_UDID)."

      - name: UI test the group in the Simulator
        # Replays the committed synthetic wall (ios/HouseScanUITests/Fixtures/synthetic-wall) with
        # -autopilot and the bundled sample result; photoProcessing adds its in-app fixture.
        run: |
          if [ "$GROUP" = journey ] && [ "$FULL_UI" != "true" ]; then
            echo "::notice::Skipped the every-state accessibility audit (about 10 min). Add the full-ui label to run it on this pull request."
          fi
          # Read without mapfile: the runner's /bin/bash is 3.2.
          list="$(python3 ios/Tools/ui-test-groups.py args "$GROUP" --full-ui "$FULL_UI")"
          selectors=()
          while IFS= read -r line; do selectors+=("$line"); done <<< "$list"
          echo "Selectors: ${selectors[*]}"
          xcodebuild -project ios/HouseScan.xcodeproj -scheme HouseScan -configuration Debug \
            -destination "id=$SIM_UDID" \
            -resultBundlePath "$RUNNER_TEMP/HouseScanUITests.xcresult" \
            "${selectors[@]}" \
            COMPILER_INDEX_STORE_ENABLE=NO test

      - name: Keep UI test screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-test-results-${{ matrix.group }}
          path: ${{ runner.temp }}/HouseScanUITests.xcresult
          if-no-files-found: ignore
          retention-days: 7
