.lbg{fill:var(--bg)}.el{fill:var(--ink2)}
svg{--bg:#ffffff;--ink:#1a1a1a;--ink2:#333333;--mut:#4d4d4d;--edge:#333333;--df:#fff2cc;--ds:#d6b656}
.blue{--f:#dae8fc;--s:#6c8ebf}.purple{--f:#e1d5e7;--s:#9673a6}.green{--f:#d5e8d4;--s:#82b366}
@media (prefers-color-scheme:dark){
 svg{--bg:#0d1117;--ink:#e6edf3;--ink2:#d1d7e0;--mut:#9198a1;--edge:#9198a1;--df:#2e2a1a;--ds:#9c8540}
 .blue{--f:#172a45;--s:#4a78b8}.purple{--f:#2a2236;--s:#8a6aa8}.green{--f:#1a2e1f;--s:#5c9148}
}
</style>
