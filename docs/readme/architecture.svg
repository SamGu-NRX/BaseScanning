.bl{font-size:12px;fill:var(--mut)}.cd{font-size:11px;fill:var(--ink2)}
.lane .body{fill:var(--bg);stroke:var(--s)}.lane .head{fill:var(--f);stroke:var(--s)}
.box rect{fill:var(--f);stroke:var(--s)}
