[project]
name = "nonlidar-observability"
version = "0.1.0"
description = "Projection identifiability study: which wall facts do the no-LiDAR capture observations support at all? Binds the packet's raw keyframe pose/intrinsics fields to a finite pinhole model and asks which distinct wall worlds stay observationally indistinguishable."
requires-python = ">=3.12"
dependencies = ["numpy>=2.1"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv]
required-version = ">=0.11.15,<0.12"
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
