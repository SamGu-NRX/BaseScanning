[project]
name = "meter-candidate-selection"
version = "0.1.0"
description = "Whether candidate selection offers the correct meter string when top-1 recognition misses, and what each miss costs"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meter_candidates"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
