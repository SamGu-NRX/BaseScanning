[project]
name = "house-scanning-eval-models"
version = "0.1.0"
description = "Metric depth and geometry model runners (MoGe-2, Depth Anything 3 metric, MapAnything) for the wall-reconstruction eval"
requires-python = ">=3.12,<3.13"
dependencies = [
    "depth-anything-3",
    "huggingface-hub>=0.34",
    "mapanything",
    "moge",
    "numpy>=2.1",
    "opencv-python-headless>=4.10,<5",
    "pillow>=10",
    "safetensors>=0.4",
    "torch>=2.7",
    "torchvision>=0.22",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.15"]

[tool.uv]
package = false
# MapAnything pins opencv-python-headless==4.10.0.84; MoGe and DA3 ask for opencv-python. One
# headless build serves all three (two OpenCV wheels in one env overwrite each other's cv2);
# 4.x because all three were written against it.
override-dependencies = ["opencv-python-headless>=4.10,<5", "opencv-python; sys_platform == 'never'"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# The three model packages and their shared dependency have no inline types. Only their import
# sites are skipped: each runner narrows the objects it loads at its own boundary.
module = ["moge.*", "mapanything.*", "depth_anything_3.*", "utils3d.*"]
ignore_missing_imports = true


# Each model is pinned to a commit. Their packaging lists demo, export and training extras as hard
# requirements (gradio, open3d, pycolmap, xformers, evo, moviepy, numpy<2), none of which the
# inference path imports. The metadata below replaces their requirement lists with what the
# modules these runners import actually need.
[tool.uv.sources]
# Last commit before the MoGe-3 rewrite (74fbce0), whose packaging only supports Linux and Windows.
moge = { git = "https://github.com/microsoft/MoGe", rev = "07444410f1e33f402353b99d6ccd26bd31e469e8" }
depth-anything-3 = { git = "https://github.com/ByteDance-Seed/Depth-Anything-3", rev = "3d835ec1a5802d64a8b8b15f817a1ab54809bfe4" }
mapanything = { git = "https://github.com/facebookresearch/map-anything", rev = "3d10cf7a3016fc0f9bb13a071ee66c47b10be0d9" }

[[tool.uv.dependency-metadata]]
name = "moge"
version = "2.0.0"
requires-dist = [
    "huggingface-hub",
    "numpy",
    "opencv-python-headless",
    "pillow",
    "scipy",
    "torch>=2.0.0",
    "torchvision",
    "utils3d @ git+https://github.com/EasternJournalist/utils3d.git@3fab839f0be9931dac7c8488eb0e1600c236e183",
]

[[tool.uv.dependency-metadata]]
name = "depth-anything-3"
version = "0.0.0"
requires-dist = [
    "addict",
    "einops",
    "huggingface-hub",
    "imageio",
    "numpy",
    "omegaconf",
    "opencv-python-headless",
    "pillow",
    "safetensors",
    "torch>=2",
    "torchvision",
    "tqdm",
]
